<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Social Media</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-brand">Social Media</h1>
            <div class="nav-links">
                <a href="/feed">Feed</a>
                <a href="/profile/{{ session.user_id }}">Profile</a>
                <a href="/messages" class="active">Messages</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="messages-container">
            <div class="conversations-list">
                <h3>Conversations</h3>
                <div class="tabs">
                    <button id="tabInbox" class="tab active" onclick="switchTab('inbox')">Inbox</button>
                    <button id="tabRequests" class="tab" onclick="switchTab('requests')">Requests</button>
                </div>
                <div id="conversationsList"></div>
            </div>

            <div class="chat-area">
                <div id="chatHeader" class="chat-header"></div>
                <div id="messagesContainer" class="messages-content"></div>
                <div class="message-input">
                    <textarea id="messageContent" placeholder="Type a message..." rows="2"></textarea>
                    <button onclick="sendMessage()" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userId = {{ session.user_id }};
        let currentChatUserId = null;

        let activeTab = 'inbox';
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
        });

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabInbox').classList.toggle('active', tab === 'inbox');
            document.getElementById('tabRequests').classList.toggle('active', tab === 'requests');
            loadConversations();
        }

        async function loadConversations() {
            try {
                const url = activeTab === 'inbox' 
                    ? `/api/messages/conversations/${userId}`
                    : `/api/messages/requests/${userId}`;
                const response = await fetch(url);
                const data = await response.json();

                const container = document.getElementById('conversationsList');
                container.innerHTML = '';

                const list = activeTab === 'inbox' ? (data.conversations || []) : (data.requests || []);

                if (data.success && list.length > 0) {
                    list.forEach(conv => {
                        container.innerHTML += `
                            <div class="conversation-item" onclick="openChat(${conv.OtherUserID}, '${conv.OtherUsername}')">
                                <img src="${conv.OtherProfilePicture || '/static/img/default-avatar.png'}" 
                                     class="profile-pic-small">
                                <div class="conversation-info">
                                    <h4>${conv.OtherUsername}</h4>
                                    <p class="last-message">${conv.LastMessage || ''}</p>
                                </div>
                                ${conv.UnreadCount > 0 ? `<span class="unread-badge">${conv.UnreadCount}</span>` : ''}
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p class="no-content">No conversations yet</p>';
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        async function openChat(otherUserId, otherUsername) {
            currentChatUserId = otherUserId;

            // Update chat header
            document.getElementById('chatHeader').innerHTML = `<h3>Chat with ${otherUsername}</h3>`;

            // Load messages
            try {
                const response = await fetch(`/api/messages/conversation/${userId}/${otherUserId}`);
                const data = await response.json();

                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';

                if (data.success && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const isSent = msg.SenderID === userId;
                        container.innerHTML += `
                            <div class="message ${isSent ? 'sent' : 'received'}">
                                <p>${msg.Content}</p>
                                <span class="message-time">${new Date(msg.SentAt).toLocaleTimeString()}</span>
                            </div>
                        `;
                    });
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML = '<p class="no-content">No messages yet. Start the conversation!</p>';
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            if (!currentChatUserId) {
                alert('Please select a conversation first');
                return;
            }

            const content = document.getElementById('messageContent').value.trim();
            if (!content) return;

            try {
                const response = await fetch('/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender_id: userId,
                        receiver_id: currentChatUserId,
                        content: content
                    })
                });

                if (response.ok) {
                    document.getElementById('messageContent').value = '';
                    openChat(currentChatUserId, '');
                    loadConversations();
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }
    </script>
</body>
</html>
