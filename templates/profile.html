<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Social Media</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-brand">Social Media</h1>
            <div class="nav-links">
                <a href="/feed">Feed</a>
                <a href="/profile/{{ session.user_id }}" class="active">Profile</a>
                <a href="/messages">Messages</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="profile-container">
            <div class="profile-header">
                <img id="profilePicture" src="" alt="Profile" class="profile-pic-large">
                <div class="profile-info">
                    <h2 id="username"></h2>
                    <p id="bio"></p>
                    <div class="profile-stats">
                        <span><strong id="postCount">0</strong> Posts</span>
                        <span><strong id="followerCount">0</strong> Followers</span>
                        <span><strong id="followingCount">0</strong> Following</span>
                    </div>
                    <button id="followBtn" onclick="toggleFollow()" class="btn btn-primary"></button>
                    <div id="privacyContainer" style="margin-top:10px; display:none;">
                        <label>
                            <select id="privacySelect">
                                <option value="public">Public</option>
                                <option value="private">Private</option>
                            </select>
                        </label>
                        <button class="btn btn-secondary" onclick="updatePrivacy()">Update Privacy</button>
                    </div>
                </div>
            </div>

            <div class="profile-posts">
                <h3>Posts</h3>
                <div id="postsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const currentUserId = {{ session.user_id }};
        const profileUserId = {{ profile_user_id }};

        document.addEventListener('DOMContentLoaded', loadProfile);

        async function loadProfile() {
            try {
                const response = await fetch(`/api/users/profile/${profileUserId}?viewer=${currentUserId}`);
                const data = await response.json();

                if (data.success && data.profile) {
                    const profile = data.profile;
                    document.getElementById('username').textContent = profile.Username;
                    document.getElementById('bio').textContent = profile.Bio || 'No bio yet';
                    document.getElementById('profilePicture').src = profile.ProfilePicture || '/static/img/default-avatar.png';
                    document.getElementById('postCount').textContent = profile.PostCount || 0;
                    document.getElementById('followerCount').textContent = profile.FollowerCount || 0;
                    document.getElementById('followingCount').textContent = profile.FollowingCount || 0;

                    // Show/hide follow button
                    const followBtn = document.getElementById('followBtn');
                    if (profileUserId === currentUserId) {
                        followBtn.style.display = 'none';
                        // show privacy control for own profile
                        const pc = document.getElementById('privacyContainer');
                        pc.style.display = 'block';
                        const sel = document.getElementById('privacySelect');
                        sel.value = (profile.PrivacySettings || 'public');
                    } else {
                        followBtn.textContent = profile.IsFollowedByViewer ? 'Unfollow' : 'Follow';
                        followBtn.style.display = 'inline-block';
                    }

                    loadUserPosts();
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function loadUserPosts() {
            try {
                const response = await fetch(`/api/users/${profileUserId}/posts?viewer=${currentUserId}`);
                const data = await response.json();

                const container = document.getElementById('postsContainer');
                container.innerHTML = '';

                if (data.private === true) {
                    container.innerHTML = '<p class="no-content">This account is private. Follow to see their posts.</p>';
                    return;
                }

                if (data.success && data.posts.length > 0) {
                    data.posts.forEach(post => {
                        container.innerHTML += `
                            <div class="post-card">
                                <div class="post-content">
                                    <p>${post.Content}</p>
                                    ${post.Media ? `<img src="${post.Media}" class="post-media">` : ''}
                                </div>
                                <div class="post-actions">
                                    <span>❤️ ${post.LikeCount || 0} Likes</span>
                                    <span>💬 ${post.CommentCount || 0} Comments</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p class="no-content">No posts yet</p>';
                }
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        async function toggleFollow() {
            try {
                const response = await fetch(`/api/users/${profileUserId}/follow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ follower_id: currentUserId })
                });

                if (response.ok) {
                    loadProfile();
                }
            } catch (error) {
                console.error('Error toggling follow:', error);
            }
        }

        async function updatePrivacy() {
            const privacy = document.getElementById('privacySelect').value;
            try {
                const res = await fetch(`/api/users/${currentUserId}/privacy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ privacy })
                });
                if (res.ok) {
                    alert('Privacy updated');
                }
            } catch (e) { console.error('privacy update', e); }
        }
    </script>
</body>
</html>
